include ':app'

def flutterRoot = System.getenv("FLUTTER_ROOT")
if (flutterRoot == null) {
    def localProperties = new Properties()
    def localPropertiesFile = new File(rootDir, 'local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader('UTF-8') { localProperties.load(it) }
    }
    flutterRoot = localProperties.getProperty('flutter.sdk')
}
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found.")
}
